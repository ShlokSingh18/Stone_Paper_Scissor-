{%load static%}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STONE PAPER SCISSOR - VANKU</title>
    <style>@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Orbitron',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:linear-gradient(135deg,#040b18,#0b1633,#111d3f,#040b18);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
    color:#fff;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* ---------- Header ---------- */

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
}

header h1{
    color:#00f7ff;
    font-size:2.5rem;
    text-shadow:
        0 0 10px #00f7ff,
        0 0 20px #00f7ff;
}

nav img{
    width:55px;
    transition:.3s;
    filter:drop-shadow(0 0 8px cyan);
}

nav img:hover{
    transform:scale(1.15) rotate(-10deg);
}

/* ---------- Main ---------- */

main{
    flex:1;
    width:90%;
    max-width:900px;
    margin:40px auto;
    background:rgba(255,255,255,.06);
    border:2px solid rgba(0,247,255,.2);
    border-radius:25px;
    backdrop-filter:blur(12px);
    text-align:center;
    padding:45px;
    box-shadow:0 0 25px rgba(0,247,255,.2);
}

main img{
    width:120px;
    margin:20px;
    transition:.35s;
    filter:drop-shadow(0 0 15px cyan);
    animation:float 3s ease-in-out infinite;
}

main img:nth-child(2){
    animation-delay:.4s;
}

main img:nth-child(3){
    animation-delay:.8s;
}

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
    100%{transform:translateY(0);}
}

main img:hover{
    transform:scale(1.15);
    filter:drop-shadow(0 0 30px cyan);
}

h2{
    margin:35px 0 25px;
    color:#00f7ff;
    text-shadow:0 0 12px cyan;
    letter-spacing:2px;
}

/* ---------- Form ---------- */

form{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
}

input[type="number"]{
    width:260px;
    padding:14px;
    font-size:18px;
    text-align:center;
    border:none;
    outline:none;
    border-radius:10px;
    background:#0e1d3f;
    color:white;
    border:2px solid cyan;
    box-shadow:0 0 12px rgba(0,255,255,.3);
    transition:.3s;
}

input[type="number"]:focus{
    transform:scale(1.05);
    box-shadow:
        0 0 10px cyan,
        0 0 25px cyan;
}

input::placeholder{
    color:#9eb6d9;
}

/* ---------- Button ---------- */

button{
    padding:14px 45px;
    border:none;
    border-radius:50px;
    background:linear-gradient(90deg,#00f7ff,#0066ff);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    letter-spacing:2px;
    box-shadow:0 0 20px rgba(0,247,255,.5);
}

button:hover{
    transform:translateY(-4px) scale(1.05);
    box-shadow:
        0 0 20px cyan,
        0 0 40px cyan;
}

button:active{
    transform:scale(.95);
}

/* ---------- Footer ---------- */

footer{
    text-align:center;
    padding:18px;
    background:rgba(0,0,0,.4);
    color:#9db3d8;
    border-top:1px solid rgba(255,255,255,.1);
}

/* ---------- Responsive ---------- */

@media(max-width:768px){

header{
    flex-direction:column;
    gap:20px;
}

header h1{
    font-size:2rem;
    text-align:center;
}

main{
    padding:30px 20px;
}

main img{
    width:90px;
    margin:10px;
}

input[type="number"]{
    width:220px;
}

}

@media(max-width:480px){

header h1{
    font-size:1.5rem;
}

main img{
    width:70px;
}

h2{
    font-size:1rem;
}

button{
    width:100%;
    max-width:220px;
}

input[type="number"]{
    width:100%;
    max-width:220px;
}

}</style>
</head>

<body>
    <header>
        <h1>STONE PAPER SCISSOR</h1>
        <nav>
            <a href="/"><img src="{%static 'homeicon.png'%}" alt="backbutton" width="50"></a>
        </nav>
    </header>
    <main>
        <img src="{%static 'stone.png'%}" alt="stone"><img src="{%static 'paper.png'%}" alt="paper"><img
            src="{%static 'scissor.png'%}" alt="scissor">

        <h2><b><u>ENTER NO OF ROUNDS</u></b></h2>
        <form  action="/round/" method="post">
            {% csrf_token %}
            <input type="number" name="rounds" id="rounds" placeholder="Enter No of Rounds" min="1" max="100" step="1" value = 0 onfocus="if(this.value=='0') this.value='';" onblur="if(this.value=='') this.value='0';" >
        <!-- <textarea type="number" name="rounds" id="rounds" placeholder="Enter No of Rounds" style="width: 100px; height: 40px; resize: none;"></textarea> -->
        <br>
        <button type="submit">select</button>
        </form>
    </main>
    <footer>
        <p>© Made by Shlok Singh 2026</p>
    </footer>
</body>

</html>
